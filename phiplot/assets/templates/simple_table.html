<div class="info-table-container">
    <table class="info-table">
        <tbody>
        {% for field, value in info.items() %}
            <tr>
                <td class="info-table-label">
                    <strong>{{ field }}</strong>
                </td>
                <td class="info-table-value">
                    {{ value }}
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
